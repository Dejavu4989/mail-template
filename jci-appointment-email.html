<!--
  Email template. index.html fills every {{token}} from the form.

  Rules that keep the rich look working in iPhone / Gmail light and dark mode:
  - Styles must stay inline. Gmail removes <style> blocks when pasting.
  - Large areas use see-through tints: rgba(...) at 15% or less. They look right on a white
    and on a black page, and if a mail app drops them the text is still readable.
  - Normal text has no color, so it inherits the mail app color and adapts by itself.
  - Solid color only on small badges and the button, with white text on a mid-tone.
  - Colored text uses only mid-tones readable on white and on black:
    #0A7CC2 (blue), #D6335A (red), #7C7C80 (gray).
  - Rows with data-if="banner" / data-if="no-banner" follow the banner choice in the maker.
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:600px;margin:0 auto;border-collapse:separate;border-spacing:0;border:1px solid rgba(10,124,194,.35);border-radius:18px;overflow:hidden;background-color:rgba(10,124,194,.05);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.55;">

  <tr data-if="banner">
    <td style="padding:0;font-size:0;line-height:0;">
      <img src="{{bannerFile}}" width="600" alt="{{heading}}" style="display:block;width:100%;max-width:600px;height:auto;border:0;border-radius:17px 17px 0 0;">
    </td>
  </tr>

  <tr data-if="no-banner">
    <td align="center" style="padding:32px 20px 4px;">
      <p style="margin:0;font-size:30px;line-height:1.25;font-weight:700;color:#0A7CC2;">&#127881; {{heading}}</p>
    </td>
  </tr>

  <tr>
    <td style="padding:28px 18px 0;">
      <p style="margin:0 0 14px;font-size:17px;">{{greeting}}</p>
      <p style="margin:0;font-size:15px;">{{intro}}</p>
    </td>
  </tr>

  <tr>
    <td style="padding:22px 18px 0;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="border-collapse:separate;border-spacing:0;">
        <tr>
          <td style="padding:18px 20px;background-color:rgba(10,124,194,.12);border:1px solid rgba(10,124,194,.35);border-left:5px solid #0A7CC2;border-radius:14px;">
            <p style="margin:0 0 6px;font-size:12px;line-height:1.4;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:#0A7CC2;">&#127942;&nbsp; {{appointmentLabel}}</p>
            <p style="margin:0;">{{appointment}}</p>
          </td>
        </tr>
      </table>
    </td>
  </tr>

  <tr>
    <td style="padding:16px 18px 0;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="border-collapse:separate;border-spacing:0;">
        <tr>
          <td style="padding:16px 18px;background-color:rgba(214,51,90,.10);border:1px solid rgba(214,51,90,.35);border-radius:14px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;">
              <tr>
                <td width="66" valign="top" style="width:66px;padding:2px 14px 0 0;">
                  <table role="presentation" width="52" cellpadding="0" cellspacing="0" border="0" style="width:52px;border-collapse:separate;border-spacing:0;">
                    <tr>
                      <td align="center" bgcolor="#D6335A" style="width:52px;padding:7px 0 6px;background-color:#D6335A;border-radius:12px;color:#FFFFFF;">
                        <div style="font-size:9px;line-height:12px;font-weight:700;letter-spacing:.5px;color:#FFFFFF;">{{deadlineMonth}}</div>
                        <div style="font-size:22px;line-height:26px;font-weight:700;color:#FFFFFF;">{{deadlineDay}}</div>
                      </td>
                    </tr>
                  </table>
                </td>
                <td valign="middle">
                  <p style="margin:0 0 4px;font-size:12px;line-height:1.4;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:#D6335A;">&#9200;&nbsp; {{deadlineLabel}}</p>
                  <p style="margin:0;font-size:15px;line-height:1.5;">{{deadlineText}}</p>
                </td>
              </tr>
            </table>
          </td>
        </tr>
      </table>
    </td>
  </tr>

  <tr>
    <td align="center" style="padding:26px 18px 0;">
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:separate;border-spacing:0;">
        <tr>
          <td align="center" bgcolor="#0A7CC2" style="background-color:#0A7CC2;border-radius:999px;">
            <a href="{{phoneHref}}" style="display:inline-block;padding:14px 20px;font-size:15px;line-height:1.3;font-weight:700;color:#FFFFFF;text-decoration:none;">&#128222;&nbsp; {{contactButton}}</a>
          </td>
        </tr>
      </table>
      <p style="margin:12px 0 0;font-size:13px;line-height:1.5;color:#7C7C80;">{{replyNote}}</p>
    </td>
  </tr>

  <tr>
    <td style="padding:26px 18px 28px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;">
        <tr>
          <td style="padding:20px 0 0;border-top:1px dashed rgba(10,124,194,.45);">
            <p style="margin:0 0 10px;font-size:14px;color:#7C7C80;">{{signoff}}</p>
            <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;">
              <tr>
                <td valign="middle" style="padding:0 14px 0 0;">
                  <table role="presentation" width="46" cellpadding="0" cellspacing="0" border="0" style="width:46px;border-collapse:separate;border-spacing:0;">
                    <tr>
                      <td align="center" bgcolor="#0A7CC2" style="width:46px;height:46px;background-color:#0A7CC2;border-radius:23px;font-size:17px;line-height:46px;font-weight:700;color:#FFFFFF;">{{initials}}</td>
                    </tr>
                  </table>
                </td>
                <td valign="middle">
                  <p style="margin:0;font-size:16px;line-height:1.35;font-weight:700;">{{senderName}}</p>
                  <p style="margin:2px 0 0;font-size:13px;line-height:1.45;">{{senderDetails}}</p>
                </td>
              </tr>
            </table>
          </td>
        </tr>
      </table>
    </td>
  </tr>

  <tr>
    <td align="center" style="padding:14px 20px;background-color:rgba(10,124,194,.12);border-top:1px solid rgba(10,124,194,.25);border-radius:0 0 17px 17px;font-size:12px;line-height:1.5;">
      <span style="color:#E0A100;">&#10022;</span>&nbsp; {{footer}} &nbsp;<span style="color:#E0A100;">&#10022;</span>
    </td>
  </tr>

</table>
